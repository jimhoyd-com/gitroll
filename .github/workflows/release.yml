# Builds, verifies on clean machines, and publishes a GitRoll release when a vX.Y.Z tag is pushed.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: make check
      - name: Build release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release.mjs --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Install on a clean machine and use it
        run: node scripts/verify-install.mjs release

  verify-homebrew:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Install the generated formula from the release package and run its tests
        run: |
          set -eu
          tarball="$(ls release/gitroll-*.tgz)"
          mkdir -p /tmp/gitroll-tap/Formula
          # Same formula, pointed at the artifact built above (the published URL doesn't exist yet).
          sed "s|^  url \".*\"|  url \"file://$PWD/$tarball\"|" release/gitroll.rb > /tmp/gitroll-tap/Formula/gitroll.rb
          cd /tmp/gitroll-tap && git init -q && git add . && git -c user.name=ci -c user.email=ci@example.com commit -qm formula
          brew tap-new --no-git gitroll/verify >/dev/null
          cp /tmp/gitroll-tap/Formula/gitroll.rb "$(brew --repository)/Library/Taps/gitroll/homebrew-verify/Formula/gitroll.rb"
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_FROM_API=1 brew install --build-from-source gitroll/verify/gitroll
          brew test gitroll/verify/gitroll
          gitroll help | grep -q 'gitroll log'

  verify-scoop:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install the generated manifest with Scoop from the release package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Scoop's official installer (the runner is an administrator, which Scoop must be told).
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install-scoop.ps1
          ./install-scoop.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          # Same manifest, pointed at the artifact built above (the published URL doesn't exist yet).
          # Node.js and Git are already on the runner, so the manifest's dependencies are skipped here.
          $package = (Resolve-Path release/gitroll-*.tgz).Path
          $manifest = Get-Content release/gitroll.json -Raw | ConvertFrom-Json
          $manifest.url = ([Uri]$package).AbsoluteUri
          $manifest.depends = @()
          $manifest | ConvertTo-Json -Depth 5 | Set-Content gitroll.json -Encoding utf8
          scoop install ./gitroll.json
          if (-not ((gitroll help) -match 'gitroll log')) { throw 'gitroll help did not work after installing with Scoop' }
          $version = gitroll version
          if ($version -notmatch 'installed with Scoop') { throw "gitroll version didn't recognize Scoop: $version" }
          Write-Output $version
          scoop uninstall gitroll
          if (Get-Command gitroll -ErrorAction SilentlyContinue) { throw 'gitroll is still installed after scoop uninstall' }

  publish:
    needs: [verify, verify-homebrew, verify-scoop]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/gitroll-*.tgz
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          notes="See CHANGELOG.md. Verify the download with SHA256SUMS, or with: gh attestation verify gitroll-${TAG#v}.tgz --repo $REPO"
          gh release create "$TAG" release/* --repo "$REPO" --title "GitRoll ${TAG#v}" --notes "$notes"

  publish-template:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Publish starter files to the Roll template repository
        env:
          # Fine-grained token with Contents: read and write on jimhoyd-com/gitroll-template only.
          TEMPLATE_REPO_TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN }}
        run: |
          if [ -z "$TEMPLATE_REPO_TOKEN" ]; then
            echo "::warning::TEMPLATE_REPO_TOKEN isn't set, so the template repository wasn't updated."
            exit 0
          fi
          node scripts/publish-template.mjs --repo jimhoyd-com/gitroll-template

  publish-homebrew:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Publish the verified formula to the Homebrew tap
        env:
          # Fine-grained token with Contents: read and write on jimhoyd-com/homebrew-tap only.
          TAP_REPO_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_REPO_TOKEN" ]; then
            echo "::warning::TAP_REPO_TOKEN isn't set, so the Homebrew tap wasn't updated. Copy gitroll.rb from the release to jimhoyd-com/homebrew-tap/Formula/ by hand."
            exit 0
          fi
          git clone -q "https://x-access-token:${TAP_REPO_TOKEN}@github.com/jimhoyd-com/homebrew-tap.git" tap
          install -m 644 release/gitroll.rb tap/Formula/gitroll.rb
          cd tap
          git add Formula/gitroll.rb
          if git diff --cached --quiet; then
            echo "The tap already has GitRoll ${TAG#v}."
            exit 0
          fi
          git -c user.name="GitRoll release" -c user.email="releases@users.noreply.github.com" commit -q -m "gitroll ${TAG#v}"
          git push -q origin HEAD:main

  publish-scoop:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Publish the verified manifest to the Scoop bucket
        env:
          # Fine-grained token with Contents: read and write on jimhoyd-com/scoop-bucket only.
          SCOOP_REPO_TOKEN: ${{ secrets.SCOOP_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$SCOOP_REPO_TOKEN" ]; then
            echo "::warning::SCOOP_REPO_TOKEN isn't set, so the Scoop bucket wasn't updated. Copy gitroll.json from the release to jimhoyd-com/scoop-bucket/bucket/ by hand."
            exit 0
          fi
          git clone -q "https://x-access-token:${SCOOP_REPO_TOKEN}@github.com/jimhoyd-com/scoop-bucket.git" bucket
          install -m 644 release/gitroll.json bucket/bucket/gitroll.json
          cd bucket
          git add bucket/gitroll.json
          if git diff --cached --quiet; then
            echo "The bucket already has GitRoll ${TAG#v}."
            exit 0
          fi
          git -c user.name="GitRoll release" -c user.email="releases@users.noreply.github.com" commit -q -m "gitroll ${TAG#v}"
          git push -q origin HEAD:main

  publish-npm:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only release tags can use this environment; npm's trusted publisher is tied to it.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@^11.5.1
      - name: Publish the verified package to npm with provenance
        # Trusted publishing: npm checks GitHub's short-lived OIDC identity. No npm token exists.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! npm view gitroll name >/dev/null 2>&1; then
            echo "::warning::gitroll isn't on npm yet. Publish the first version by hand and set up trusted publishing (see packaging/README.md)."
            exit 0
          fi
          if npm view "gitroll@$version" version >/dev/null 2>&1; then
            echo "gitroll@$version is already on npm."
            exit 0
          fi
          npm publish "release/gitroll-$version.tgz" --provenance --access public
