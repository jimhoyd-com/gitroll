# CI for GitRoll's own source code. Rolls themselves need no GitHub Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # The browser checks need the built app and a real browser, and they are
      # not allowed to skip: GITROLL_REQUIRE_BROWSER=1 fails the run if either
      # is missing. So both are in place before the tests, not after them.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          GITROLL_REQUIRE_BROWSER: "1"
      - name: CLI starts from the build
        run: node dist/gitroll.mjs help
      - run: npm audit --audit-level=high
