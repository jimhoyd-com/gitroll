version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
    ignore:
      # GitRoll supports Node.js 20 and newer, so its Node type definitions stay on that
      # major. Newer ones would let code use APIs that don't exist on Node 20.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # All github/codeql-action steps in a workflow must run the same version, or
      # CodeQL stops with a configuration error, so they move together.
      codeql:
        patterns: ["github/codeql-action*"]
